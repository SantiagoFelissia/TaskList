<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskList — Gestión de Tareas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
 
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
 
  <!-- <div class="notebook-bg" aria-hidden="true">
    <div class="nb-line"></div><div class="nb-line"></div><div class="nb-line"></div>
    <div class="nb-line"></div><div class="nb-line"></div><div class="nb-line"></div>
    <div class="nb-line"></div><div class="nb-line"></div><div class="nb-line"></div>
  </div>
-->
  <div class="layout">
 
    <!-- ══ SIDEBAR: formulario de ingreso ══ -->
    <aside class="sidebar">
 
      <header class="brand">
        <span class="brand-icon" aria-hidden="true">✦</span>
        <div>
          <h1 class="brand-title">TASKLIST</h1>
          <p class="brand-sub">Gestión de tareas</p>
        </div>
      </header>
 
      <!-- Contador visual de tareas pendientes -->
      <div class="task-counter">
        <span class="counter-num" id="taskCount">0</span>
        <span class="counter-label">tareas pendientes</span>
      </div>
 
      <!-- ── FORMULARIO DE NUEVA TAREA ── -->
      <form class="task-form" id="taskForm" novalidate>
 
        <!-- Campo: nombre de la tarea -->
        <div class="field-group">
          <label class="field-label" for="taskName">Tarea</label>
          <input
            type="text"
            id="taskName"
            class="field-input"
            placeholder="Ej: Tareas "
            maxlength="80"
            autocomplete="off"
          />
        </div>
 
        <!-- Campo: materia -->
        <div class="field-group">
          <label class="field-label" for="taskSubject">Area</label>
          <input
            type="text"
            id="taskSubject"
            class="field-input"
            placeholder="Ej: Facultad,Trabajo "
            maxlength="40"
            autocomplete="off"
          />
        </div>
 
        <!-- Campo: fecha límite -->
        <div class="field-group">
          <label class="field-label" for="taskDate">Fecha límite</label>
          <input
            type="date"
            id="taskDate"
            class="field-input"
          />
        </div>
 
        <!-- Campo: prioridad (radio buttons personalizados) -->
        <div class="field-group">
          <label class="field-label">Prioridad</label>
          <div class="priority-selector" role="group" aria-label="Seleccionar prioridad">
            <label class="priority-opt prio-alta">
              <input type="radio" name="priority" value="Alta" />
              <span>Alta</span>
            </label>
           
            <label class="priority-opt prio-baja">
              <input type="radio" name="priority" value="Baja" />
              <span>Baja</span>
            </label>
          </div>
        </div>
 
        <!-- Mensaje de error de validación -->
        <p class="form-error" id="formError" role="alert" aria-live="polite"></p>
 
        <!-- Botón de envío -->
        <button type="submit" class="btn-add">
          <span aria-hidden="true">+</span> Agregar tarea
        </button>
 
      </form>
    </aside>
 
    <!-- ══ ÁREA PRINCIPAL: lista de tareas ══ -->
    <main class="main">
 
      <!-- Cabecera con título y filtros -->
      <div class="main-header">
        <h2 class="main-title">Mis tareas</h2>
        <div class="filters" role="group" aria-label="Filtrar por prioridad">
          <button class="filter-btn active" data-filter="all">Todas</button>
          <button class="filter-btn" data-filter="Alta">Alta</button>
          <button class="filter-btn" data-filter="Baja">Baja</button>
        </div>
      </div>
 
      <!-- Leyenda de colores por urgencia de fecha -->
      <div class="legend">
        <span class="legend-item legend-urgent">● Vence hoy o dentro de poco</span>
        <span class="legend-item legend-ok">● poca importancia</span>
      </div>
 
      <!-- Lista de tareas (JS la llena dinámicamente) -->
      <ul class="task-list" id="taskList" aria-label="Lista de tareas pendientes">
 
        <!-- Estado vacío: visible solo cuando no hay tareas -->
        <li class="empty-state" id="emptyState">
          <span class="empty-icon" aria-hidden="true">📋</span>
          <p>Sin tareas pendientes</p>
          <p class="empty-sub">Agregá una desde el formulario izquierdo.</p>
        </li>
 
      </ul>
 
    </main>
  </div>
 
  <script >

/* ══════════════════════════════════════
   REFERENCIAS AL DOM
══════════════════════════════════════ */
const taskForm    = document.getElementById('taskForm');
const taskName    = document.getElementById('taskName');
const taskSubject = document.getElementById('taskSubject');
const taskDate    = document.getElementById('taskDate');
const formError   = document.getElementById('formError');
const taskList    = document.getElementById('taskList');
const emptyState  = document.getElementById('emptyState');
const taskCount   = document.getElementById('taskCount');
const filterBtns  = document.querySelectorAll('.filter-btn');

/* ══════════════════════════════════════
   ESTADO DE LA APLICACIÓN
   (todo vive aquí mientras la página está abierta)
══════════════════════════════════════ */
let tareas = [];             // Array de objetos tarea
let filtroActivo = 'all';    // Filtro actual de prioridad

/* ══════════════════════════════════════
   CALCULAR URGENCIA SEGÚN LA FECHA
   Compara la fecha de entrega con hoy.
   Devuelve: 'urgent' | 'soon' | 'ok'
══════════════════════════════════════ */
function calcularUrgencia(fechaStr) {
  // Parseamos la fecha evitando problemas de zona horaria:
  // "YYYY-MM-DD" → separamos y construimos manualmente
  const [anio, mes, dia] = fechaStr.split('-').map(Number);
  const fechaTarea = new Date(anio, mes - 1, dia); // mes 0-indexado

  // Hoy al inicio del día (sin horas)
  const hoy = new Date();
  hoy.setHours(0, 0, 0, 0);

  // Diferencia en milisegundos → convertir a días
  const diffMs   = fechaTarea - hoy;
  const diffDias = Math.ceil(diffMs / (1000 * 60 * 60 * 24));

  if (diffDias <= 0) return 'urgent'; // vencida o vence hoy
  if (diffDias <= 3) return 'soon';   // 1 a 3 días restantes
  return 'ok';                        // más de 3 días
}

/* ══════════════════════════════════════
   FORMATEAR FECHA para mostrar al usuario
   "2025-07-20" → "20 jul 2025"
══════════════════════════════════════ */
function formatearFecha(fechaStr) {
  const [anio, mes, dia] = fechaStr.split('-').map(Number);
  const fecha = new Date(anio, mes - 1, dia);
  return fecha.toLocaleDateString('es-AR', {
    day:   '2-digit',
    month: 'short',
    year:  'numeric',
  });
}

/* ══════════════════════════════════════
   ACTUALIZAR CONTADOR DEL SIDEBAR
══════════════════════════════════════ */
function actualizarContador() {
  taskCount.textContent = tareas.length;
}

/* ══════════════════════════════════════
   MOSTRAR / OCULTAR EL ESTADO VACÍO
══════════════════════════════════════ */
function actualizarEstadoVacio() {
  // El <li> de estado vacío se muestra solo si no hay tareas en el DOM
  // (después de aplicar filtros puede haber ítems ocultos, pero contamos los visibles)
  const visibles = taskList.querySelectorAll('.task-item:not(.hidden-by-filter)');
  emptyState.style.display = visibles.length === 0 ? 'flex' : 'none';
}

/* ══════════════════════════════════════
   CREAR EL ELEMENTO <li> DE UNA TAREA
   Recibe un objeto tarea y devuelve un <li> listo para insertar.
══════════════════════════════════════ */
function crearElementoTarea(tarea) {
  const urgencia = calcularUrgencia(tarea.fecha);

  // Etiqueta de urgencia en texto (para accesibilidad y tooltip)
  const urgenciaTexto = {
    urgent: 'Urgente',
    soon:   'Pronto',
    ok:     'A tiempo',
  }[urgencia];

  // Crear el <li>
  const li = document.createElement('li');
  li.classList.add('task-item', `urgency-${urgencia}`);
  li.dataset.id       = tarea.id;       // para identificarla al borrar
  li.dataset.prioridad = tarea.prioridad; // para los filtros

  // Verificar si debe estar oculta según el filtro activo
  if (filtroActivo !== 'all' && tarea.prioridad !== filtroActivo) {
    li.classList.add('hidden-by-filter');
  }

  // Clases CSS de prioridad para el badge
  const prioCss = {
    Alta:  'prio-alta',
    Baja:  'prio-baja',
  }[tarea.prioridad] || 'prio-media';

  // Construir el HTML interno de la tarjeta
  li.innerHTML = `
    <!-- Barra lateral de color de urgencia -->
    <div class="task-urgency-bar" title="${urgenciaTexto}"></div>

    <!-- Cuerpo: nombre, materia, fecha, prioridad -->
    <div class="task-body">
      <span class="task-name" title="${tarea.nombre}">${tarea.nombre}</span>
      <div class="task-meta">
        <span class="task-subject">${tarea.materia}</span>
        <span class="task-date">📅 ${formatearFecha(tarea.fecha)}</span>
        <span class="task-priority ${prioCss}">${tarea.prioridad}</span>
      </div>
    </div>

    <!-- Acciones: Hecho + Eliminar -->
    <div class="task-actions">
      <button class="btn-done"   data-id="${tarea.id}" aria-label="Marcar como hecho">✓ Hecho</button>
      <button class="btn-delete" data-id="${tarea.id}" aria-label="Eliminar tarea">✕ Eliminar</button>
    </div>
  `;

  /* ── Asignar eventos a los botones de la tarjeta ── */

  // Botón "Hecho": elimina la tarea
  li.querySelector('.btn-done').addEventListener('click', () => {
    eliminarTarea(tarea.id, li);
  });

  // Botón "Eliminar": también elimina la tarea
  li.querySelector('.btn-delete').addEventListener('click', () => {
    eliminarTarea(tarea.id, li);
  });

  return li;
}

/* ══════════════════════════════════════
   AGREGAR UNA TAREA
   Crea el objeto, lo guarda en el array y lo renderiza.
══════════════════════════════════════ */
function agregarTarea(nombre, materia, fecha, prioridad) {
  // Crear objeto tarea con ID único basado en timestamp
  const nuevaTarea = {
    id:        Date.now(),
    nombre:    nombre.trim(),
    materia:   materia.trim(),
    fecha:     fecha,
    prioridad: prioridad,
  };

  // Agregar al array de estado
  tareas.push(nuevaTarea);

  // Crear y agregar el elemento al DOM
  const li = crearElementoTarea(nuevaTarea);

  // Insertamos antes del estado vacío para que quede al final de la lista real
  taskList.insertBefore(li, emptyState);

  // Actualizar UI
  actualizarContador();
  actualizarEstadoVacio();
}

/* ══════════════════════════════════════
   ELIMINAR UNA TAREA
   Anima la salida del <li> y luego lo remueve del DOM y del array.
══════════════════════════════════════ */
function eliminarTarea(id, elemento) {
  // 1. Agregar clase de animación de salida
  elemento.classList.add('removing');

  // 2. Esperar a que termine la animación CSS (~300ms) y luego remover
  elemento.addEventListener('animationend', () => {
    // Remover del DOM
    elemento.remove();

    // Remover del array de estado (filter devuelve todos EXCEPTO el borrado)
    tareas = tareas.filter(t => t.id !== id);

    // Actualizar UI
    actualizarContador();
    actualizarEstadoVacio();
  }, { once: true }); // { once: true } → el listener se auto-destruye después de ejecutarse una vez
}

/* ══════════════════════════════════════
   APLICAR FILTRO DE PRIORIDAD
   Oculta/muestra tarjetas según el filtro seleccionado.
══════════════════════════════════════ */
function aplicarFiltro(filtro) {
  filtroActivo = filtro;

  // Iterar sobre todas las tarjetas en el DOM
  const items = taskList.querySelectorAll('.task-item');

  items.forEach(item => {
    const prioridadItem = item.dataset.prioridad;

    if (filtro === 'all' || prioridadItem === filtro) {
      // Mostrar: quitar clase de oculto
      item.classList.remove('hidden-by-filter');
    } else {
      // Ocultar
      item.classList.add('hidden-by-filter');
    }
  });

  actualizarEstadoVacio();
}

/* ══════════════════════════════════════
   VALIDAR EL FORMULARIO
   Devuelve true si todo está OK, false si hay errores.
══════════════════════════════════════ */
function validarFormulario() {
  const nombre   = taskName.value.trim();
  const materia  = taskSubject.value.trim();
  const fecha    = taskDate.value;
  const prioridad = taskForm.querySelector('input[name="priority"]:checked');

  // Verificar campos vacíos uno por uno
  if (!nombre) {
    mostrarError('↑ Escribí el nombre de la tarea.');
    taskName.focus();
    return false;
  }

  if (!materia) {
    mostrarError('↑ Escribí la materia.');
    taskSubject.focus();
    return false;
  }

  if (!fecha) {
    mostrarError('↑ Seleccioná una fecha límite.');
    taskDate.focus();
    return false;
  }

  if (!prioridad) {
    mostrarError('↑ Seleccioná la prioridad.');
    return false;
  }

  // Todo OK
  limpiarError();
  return true;
}

/* Mostrar y limpiar mensajes de error */
function mostrarError(msg) { formError.textContent = msg; }
function limpiarError()    { formError.textContent = ''; }

/* ══════════════════════════════════════
   LIMPIAR EL FORMULARIO
   Después de agregar una tarea, resetear los campos.
══════════════════════════════════════ */
function limpiarFormulario() {
  taskName.value    = '';
  taskSubject.value = '';
  taskDate.value    = '';
  // Dejar "Media" seleccionada por defecto
  taskForm.querySelector('input[value="Media"]').checked = true;
  limpiarError();
}

/* ══════════════════════════════════════
   EVENTO: SUBMIT DEL FORMULARIO
══════════════════════════════════════ */
taskForm.addEventListener('submit', (e) => {
  // Prevenir el comportamiento nativo (recargar la página)
  e.preventDefault();

  // Validar antes de continuar
  if (!validarFormulario()) return;

  // Leer los valores del formulario
  const nombre    = taskName.value.trim();
  const materia   = taskSubject.value.trim();
  const fecha     = taskDate.value;
  const prioridad = taskForm.querySelector('input[name="priority"]:checked').value;

  // Agregar la tarea
  agregarTarea(nombre, materia, fecha, prioridad);

  // Limpiar el formulario para la próxima entrada
  limpiarFormulario();

  // Devolver el foco al primer campo para agilizar el ingreso
  taskName.focus();
});

/* ══════════════════════════════════════
   EVENTOS: BOTONES DE FILTRO
══════════════════════════════════════ */
filterBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    // Quitar clase activa del botón anterior
    filterBtns.forEach(b => b.classList.remove('active'));
    // Activar el botón clickeado
    btn.classList.add('active');
    // Aplicar el filtro
    aplicarFiltro(btn.dataset.filter);
  });
});

/* ══════════════════════════════════════
   INICIALIZACIÓN
══════════════════════════════════════ */
window.addEventListener('DOMContentLoaded', () => {
  // Establecer la fecha mínima del input como hoy
  // (para no poder agregar tareas con fechas pasadas si se prefiere;
  //  en este caso lo dejamos libre para flexibilidad)
  const hoy = new Date().toISOString().split('T')[0];
  taskDate.setAttribute('min', hoy);

  // Mostrar el estado vacío inicial
  actualizarEstadoVacio();

  // Foco en el primer campo
  taskName.focus();
});
  </script>
  <style>
  
/* ── VARIABLES ── */
:root {
  /* Fondo y superficies */
  --bg:          #1a2035;   /* azul pizarrón oscuro */
  --bg-2:        #1f2844;   /* variante ligeramente más clara */
  --sidebar-bg:  #141929;   /* sidebar aún más oscuro */
  --card-bg:     #ffffff;   /* tarjetas blancas tipo papel */
  --card-bg-alt: #fafaf7;   /* fondo leve para alternos */

  /* Texto */
  --text-main:   #1a2035;   /* texto sobre fondo claro */
  --text-light:  #e8eaf2;   /* texto sobre fondo oscuro */
  --text-dim:    #8892a4;   /* texto secundario sobre oscuro */
  --text-muted:  #9ea8b8;   /* texto apagado */

  /* Acento principal */
  --accent:      #4f8ef7;   /* azul vibrante */
  --accent-pale: #4f8ef715;

  /* Colores de urgencia (para el indicador de fecha) */
  --urgent:      #e8392a;   /* rojo — vence hoy o vencida */
  --urgent-bg:   #e8392a12;
  --soon:        #e09830;   /* amarillo — faltan pocos días */
  --soon-bg:     #e0983012;
  --ok:          #27a56b;   /* verde — hay tiempo */
  --ok-bg:       #27a56b12;

  /* Colores de prioridad */
  --prio-alta:   #e8392a;
  --prio-media:  #e09830;
  --prio-baja:   #27a56b;

  /* Bordes */
  --border:      #e2e6f0;
  --border-dark: #2a3350;

  /* Fuentes */
  --font-serif: 'DM Serif Display', Georgia, serif;
  --font-sans:  'DM Sans', system-ui, sans-serif;
  --font-mono:  'DM Mono', 'Courier New', monospace;

  --radius:     10px;
  --radius-sm:  6px;
  --shadow-card: 0 2px 12px #1a203520, 0 1px 3px #1a203510;
  --transition: 0.2s ease;
}

/* ── RESET ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; }

body {
  background-color: var(--bg);
  color: var(--text-light);
  font-family: var(--font-sans);
  min-height: 100vh;
  position: relative;
  overflow-x: hidden;
}

/* ── FONDO: LÍNEAS DE CUADERNO ── */
.notebook-bg {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-evenly;
  pointer-events: none;
  z-index: 0;
}

.nb-line {
  width: 100%;
  height: 1px;
  /* Línea horizontal sutil con degradado en los bordes */
  background: linear-gradient(
    to right,
    transparent 0%,
    var(--border-dark) 15%,
    var(--border-dark) 85%,
    transparent 100%
  );
  opacity: 0.35;
}

/* ── LAYOUT DE DOS COLUMNAS ── */
.layout {
  position: relative;
  z-index: 1;
  display: grid;
  /* Sidebar fija de 300px + contenido que ocupa el resto */
  grid-template-columns: 300px 1fr;
  min-height: 100vh;
}

/* ══════════════════════════════════════════════
   SIDEBAR
══════════════════════════════════════════════ */
.sidebar {
  background: var(--sidebar-bg);
  /* Borde derecho con degradado vertical */
  border-right: 1px solid var(--border-dark);
  padding: 2rem 1.5rem;
  display: flex;
  flex-direction: column;
  gap: 1.8rem;
  /* Fija en scroll largo */
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
}

/* ── MARCA / LOGO ── */
.brand {
  display: flex;
  align-items: center;
  gap: 0.8rem;
}

.brand-icon {
  font-size: 1.6rem;
  color: var(--accent);
  line-height: 1;
  /* Rotación sutil al cargar */
  animation: spinIn 0.6s ease both;
}

@keyframes spinIn {
  from { transform: rotate(-180deg) scale(0); opacity: 0; }
  to   { transform: rotate(0deg) scale(1); opacity: 1; }
}

.brand-title {
  font-family: var(--font-serif);
  font-size: 1.6rem;
  color: var(--text-light);
  line-height: 1;
  letter-spacing: 0.01em;
}

.brand-sub {
  font-size: 0.68rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-top: 0.15rem;
}

/* ── CONTADOR DE TAREAS ── */
.task-counter {
  display: flex;
  align-items: baseline;
  gap: 0.5rem;
  padding: 1rem 1.1rem;
  background: var(--bg-2);
  border: 1px solid var(--border-dark);
  border-radius: var(--radius);
}

.counter-num {
  font-family: var(--font-mono);
  font-size: 2.2rem;
  font-weight: 500;
  color: var(--accent);
  line-height: 1;
  /* Transición suave al cambiar el número */
  transition: color var(--transition);
}

.counter-label {
  font-size: 0.72rem;
  letter-spacing: 0.08em;
  color: var(--text-dim);
  text-transform: uppercase;
}

/* ── FORMULARIO ── */
.task-form {
  display: flex;
  flex-direction: column;
  gap: 1rem;
}

/* Grupo de campo (label + input) */
.field-group {
  display: flex;
  flex-direction: column;
  gap: 0.4rem;
}

.field-label {
  font-size: 0.68rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-dim);
  font-weight: 500;
}

.field-input {
  padding: 0.7rem 0.85rem;
  background: var(--bg-2);
  border: 1px solid var(--border-dark);
  border-radius: var(--radius-sm);
  color: var(--text-light);
  font-family: var(--font-sans);
  font-size: 0.875rem;
  outline: none;
  transition: border-color var(--transition), box-shadow var(--transition);
}

.field-input::placeholder { color: var(--text-dim); }

/* Input de fecha: arreglar el color del ícono del calendario en dark */
.field-input[type="date"]::-webkit-calendar-picker-indicator {
  filter: invert(0.6);
  cursor: pointer;
}

.field-input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-pale);
}

/* ── SELECTOR DE PRIORIDAD ── */
.priority-selector {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 0.5rem;
}

/* Cada opción de prioridad es un label que envuelve un radio oculto */
.priority-opt {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0.5rem;
  border-radius: var(--radius-sm);
  border: 1.5px solid var(--border-dark);
  font-size: 0.78rem;
  font-weight: 500;
  cursor: pointer;
  transition: background var(--transition), border-color var(--transition), color var(--transition);
  user-select: none;
  color: var(--text-dim);
}

/* Ocultar el radio nativo */
.priority-opt input[type="radio"] { display: none; }

/* Colores al estar seleccionado */
.prio-alta:has(input:checked)  { background: #e8392a20; border-color: var(--prio-alta);  color: var(--prio-alta); }
.prio-media:has(input:checked) { background: #e0983020; border-color: var(--prio-media); color: var(--prio-media); }
.prio-baja:has(input:checked)  { background: #27a56b20; border-color: var(--prio-baja);  color: var(--prio-baja); }

/* Hover de cada opción */
.prio-alta:hover  { border-color: var(--prio-alta);  color: var(--prio-alta); }
.prio-media:hover { border-color: var(--prio-media); color: var(--prio-media); }
.prio-baja:hover  { border-color: var(--prio-baja);  color: var(--prio-baja); }

/* ── ERROR DE VALIDACIÓN ── */
.form-error {
  font-size: 0.72rem;
  color: var(--urgent);
  min-height: 1rem;
  letter-spacing: 0.02em;
}

/* ── BOTÓN AGREGAR ── */
.btn-add {
  width: 100%;
  padding: 0.85rem;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: var(--radius-sm);
  font-family: var(--font-sans);
  font-size: 0.875rem;
  font-weight: 700;
  letter-spacing: 0.06em;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  transition: background var(--transition), transform var(--transition), box-shadow var(--transition);
  margin-top: 0.3rem;
}

.btn-add:hover {
  background: #3a7ef0;
  transform: translateY(-2px);
  box-shadow: 0 6px 20px #4f8ef740;
}

.btn-add:active { transform: translateY(0); }

/* ══════════════════════════════════════════════
   ÁREA PRINCIPAL
══════════════════════════════════════════════ */
.main {
  padding: 2rem 2.5rem;
  display: flex;
  flex-direction: column;
  gap: 1.2rem;
}

/* ── CABECERA: título + filtros ── */
.main-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 1rem;
}

.main-title {
  font-family: var(--font-serif);
  font-size: 2rem;
  color: var(--text-light);
  letter-spacing: 0.01em;
}

/* ── FILTROS ── */
.filters {
  display: flex;
  gap: 0.4rem;
  flex-wrap: wrap;
}

.filter-btn {
  padding: 0.35rem 0.85rem;
  background: transparent;
  border: 1px solid var(--border-dark);
  border-radius: 999px;
  color: var(--text-dim);
  font-family: var(--font-sans);
  font-size: 0.75rem;
  font-weight: 500;
  cursor: pointer;
  transition: background var(--transition), border-color var(--transition), color var(--transition);
}

.filter-btn:hover { border-color: var(--accent); color: var(--accent); }

.filter-btn.active {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}

/* ── LEYENDA DE COLORES ── */
.legend {
  display: flex;
  gap: 1.2rem;
  flex-wrap: wrap;
  font-size: 0.68rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.legend-item { display: flex; align-items: center; gap: 0.3rem; }
.legend-urgent { color: var(--urgent); }
.legend-soon   { color: var(--soon); }
.legend-ok     { color: var(--ok); }

/* ── LISTA DE TAREAS ── */
.task-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
}

/* ── ESTADO VACÍO ── */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  padding: 4rem 2rem;
  color: var(--text-dim);
  font-size: 0.9rem;
  text-align: center;
}

.empty-icon { font-size: 2.5rem; opacity: 0.5; }
.empty-sub  { font-size: 0.75rem; color: var(--text-muted); }

/* ══════════════════════════════════════════════
   TARJETA DE TAREA
   (generada dinámicamente por JavaScript)
══════════════════════════════════════════════ */
.task-item {
  background: var(--card-bg);
  border-radius: var(--radius);
  box-shadow: var(--shadow-card);
  padding: 1rem 1.2rem;
  display: grid;
  /* Columna izquierda: indicador de color | Columna derecha: contenido */
  grid-template-columns: 6px 1fr auto;
  gap: 0 1rem;
  align-items: center;
  /* Animación de entrada */
  animation: taskIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) both;
  position: relative;
  overflow: hidden;
}

@keyframes taskIn {
  from { opacity: 0; transform: translateX(-20px); }
  to   { opacity: 1; transform: translateX(0); }
}

/* Animación de salida (clase agregada por JS antes de remover) */
.task-item.removing {
  animation: taskOut 0.3s ease forwards;
}

@keyframes taskOut {
  from { opacity: 1; transform: scale(1); max-height: 200px; }
  to   { opacity: 0; transform: scale(0.95); max-height: 0; padding: 0; margin: 0; }
}

/* ── INDICADOR LATERAL DE URGENCIA ── */
.task-urgency-bar {
  width: 6px;
  height: 100%;
  border-radius: 3px;
  /* El color se asigna con JS via clase */
}

.task-item.urgency-urgent .task-urgency-bar { background: var(--urgent); }
.task-item.urgency-soon   .task-urgency-bar { background: var(--soon); }
.task-item.urgency-ok     .task-urgency-bar { background: var(--ok); }

/* Fondo sutil según urgencia */
.task-item.urgency-urgent { background: linear-gradient(to right, var(--urgent-bg), var(--card-bg) 30%); }
.task-item.urgency-soon   { background: linear-gradient(to right, var(--soon-bg),   var(--card-bg) 30%); }
.task-item.urgency-ok     { background: linear-gradient(to right, rgb(22, 21, 21),    rgb(17, 16, 16)  30%); }

/* ── CUERPO DE LA TARJETA ── */
.task-body {
  display: flex;
  flex-direction: column;
  gap: 0.25rem;
  min-width: 0; /* para que text-overflow funcione */
}

.task-name {
  font-family: var(--font-sans);
  font-size: 0.95rem;
  font-weight: 700;
  color: white;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.task-meta {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  flex-wrap: wrap;
}

/* Chip de materia */
.task-subject {
  font-size: 0.7rem;
  font-weight: 500;
  color: white;
  background: var(--accent-pale);
  padding: 0.1rem 0.5rem;
  border-radius: 999px;
  white-space: nowrap;
}

/* Fecha */
.task-date {
  font-family: var(--font-mono);
  font-size: 0.68rem;
  color: white;
  display: flex;
  align-items: center;
  gap: 0.25rem;
}

/* Badge de prioridad */
.task-priority {
  font-size: 0.65rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 0.1rem 0.45rem;
  border-radius: 3px;
}

.task-priority.prio-alta  { color: var(--prio-alta);  background: #e92f1e15; }

.task-priority.prio-baja  { color: var(--prio-baja);  background: #0dac6115; }

/* ── BOTONES DE ACCIÓN ── */
.task-actions {
  display: flex;
  flex-direction: column;
  gap: 0.4rem;
  align-items: flex-end;
  flex-shrink: 0;
}

/* Botón base */
.task-actions button {
  padding: 0.35rem 0.8rem;
  border-radius: var(--radius-sm);
  font-family: var(--font-sans);
  font-size: 0.72rem;
  font-weight: 600;
  letter-spacing: 0.05em;
  cursor: pointer;
  border: 1.5px solid;
  transition: background var(--transition), transform var(--transition);
  white-space: nowrap;
}

.task-actions button:hover  { transform: scale(1.04); }
.task-actions button:active { transform: scale(0.98); }

/* Botón "Hecho" */
.btn-done {
  background: var(--ok-bg);
  border-color: var(--ok) !important;
  color: var(--ok) !important;
}
.btn-done:hover { background: #27a56b25 !important; }

/* Botón "Eliminar" */
.btn-delete {
  background: transparent;
  border-color: #e2e6f0 !important;
  color: var(--text-muted) !important;
}
.btn-delete:hover { background: var(--urgent-bg) !important; border-color: var(--urgent) !important; color: var(--urgent) !important; }

/* ── TAREA OCULTA POR FILTRO ── */
.task-item.hidden-by-filter { display: none; }

/* ══════════════════════════════════════════════
   RESPONSIVE — MÓVIL
══════════════════════════════════════════════ */
@media (max-width: 768px) {
  .layout {
    grid-template-columns: 1fr;
  }

  .sidebar {
    position: static;
    height: auto;
    border-right: none;
    border-bottom: 1px solid var(--border-dark);
    padding: 1.5rem 1.2rem;
  }

  .main {
    padding: 1.5rem 1.2rem;
  }

  .main-header {
    flex-direction: column;
    align-items: flex-start;
  }

  /* Las tarjetas pasan a diseño de bloque */
  .task-item {
    grid-template-columns: 6px 1fr;
    grid-template-rows: auto auto;
  }

  .task-actions {
    grid-column: 2;
    flex-direction: row;
    align-items: center;
    margin-top: 0.5rem;
  }
}

@media (max-width: 400px) {
  .legend { flex-direction: column; gap: 0.3rem; }
  .task-meta { flex-direction: column; align-items: flex-start; gap: 0.3rem; }
}
  </style>
 
</body>
</html>
